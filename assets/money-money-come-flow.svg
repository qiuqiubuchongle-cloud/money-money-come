      <rect x="22" y="22" width="56" height="56" rx="16" fill="#20363A"/>
      <text x="40" y="60" fill="#79E6B0" font-size="28" font-weight="800">1</text>
      <text x="22" y="114" fill="#F3F8F5" font-size="24" font-weight="760">Import wallets</text>
      <text x="22" y="152" fill="#A7BAB7" font-size="17">GMGN-style address list</text>
      <text x="22" y="181" fill="#A7BAB7" font-size="17">names and notes optional</text>
      <rect x="22" y="206" width="116" height="24" rx="12" fill="#23353A"/>
      <text x="36" y="224" fill="#BFD3D0" font-size="13" font-weight="650">user supplied</text>
    </g>

    <g transform="translate(402 290)">
      <rect width="220" height="246" rx="18" fill="#17242A" stroke="#2B3E45"/>
      <rect x="22" y="22" width="56" height="56" rx="16" fill="#20363A"/>
      <text x="40" y="60" fill="#79E6B0" font-size="28" font-weight="800">2</text>
      <text x="22" y="114" fill="#F3F8F5" font-size="24" font-weight="760">OKX profile</text>
      <text x="22" y="152" fill="#A7BAB7" font-size="17">PnL, win rate, activity</text>
      <text x="22" y="181" fill="#A7BAB7" font-size="17">meme market-cap preference</text>
      <rect x="22" y="206" width="128" height="24" rx="12" fill="#23353A"/>
      <text x="36" y="224" fill="#BFD3D0" font-size="13" font-weight="650">official data</text>
    </g>

    <g transform="translate(662 290)">
      <rect width="220" height="246" rx="18" fill="#17242A" stroke="#2B3E45"/>
      <rect x="22" y="22" width="56" height="56" rx="16" fill="#20363A"/>
      <text x="40" y="60" fill="#79E6B0" font-size="28" font-weight="800">3</text>
      <text x="22" y="114" fill="#F3F8F5" font-size="24" font-weight="760">Value score</text>
      <text x="22" y="152" fill="#A7BAB7" font-size="17">profitability, consistency</text>
      <text x="22" y="181" fill="#A7BAB7" font-size="17">activity and copyability</text>
      <rect x="22" y="206" width="138" height="24" rx="12" fill="#23353A"/>
      <text x="36" y="224" fill="#BFD3D0" font-size="13" font-weight="650">core / watch</text>
    </g>

