      <rect x="22" y="22" width="56" height="56" rx="16" fill="#20363A"/>
      <text x="40" y="60" fill="#79E6B0" font-size="28" font-weight="800">4</text>
      <text x="22" y="114" fill="#F3F8F5" font-size="24" font-weight="760">Group pool</text>
      <text x="22" y="152" fill="#A7BAB7" font-size="17">hot narrative, early hunter</text>
      <text x="22" y="181" fill="#A7BAB7" font-size="17">stable profit, conviction</text>
      <rect x="22" y="206" width="134" height="24" rx="12" fill="#23353A"/>
      <text x="36" y="224" fill="#BFD3D0" font-size="13" font-weight="650">safeSignalPool</text>
    </g>

    <g transform="translate(1182 290)">
      <rect width="220" height="246" rx="18" fill="#17242A" stroke="#2B3E45"/>
      <rect x="22" y="22" width="56" height="56" rx="16" fill="#20363A"/>
      <text x="40" y="60" fill="#79E6B0" font-size="28" font-weight="800">5</text>
      <text x="22" y="114" fill="#F3F8F5" font-size="24" font-weight="760">TG alert</text>
      <text x="22" y="152" fill="#A7BAB7" font-size="17">same-group concentration</text>
      <text x="22" y="181" fill="#A7BAB7" font-size="17">readable signal cards</text>
      <rect x="22" y="206" width="126" height="24" rx="12" fill="#23353A"/>
      <text x="36" y="224" fill="#BFD3D0" font-size="13" font-weight="650">human review</text>
    </g>
