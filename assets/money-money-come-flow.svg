<svg width="1536" height="864" viewBox="0 0 1536 864" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Money Money Come functional workflow</title>
  <desc id="desc">A concise OnchainOS-style workflow diagram for wallet import, OKX profiling, scoring, grouping, and Telegram alerts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1536" y2="864" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E1514"/>
      <stop offset="0.58" stop-color="#121B20"/>
      <stop offset="1" stop-color="#10131A"/>
    </linearGradient>
    <linearGradient id="accent" x1="206" y1="188" x2="1328" y2="682" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79E6B0"/>
      <stop offset="0.52" stop-color="#5CB7FF"/>
      <stop offset="1" stop-color="#B7A6FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1536" height="864" rx="0" fill="url(#bg)"/>
  <rect x="64" y="58" width="1408" height="748" rx="28" fill="#111A1F" stroke="#26343A"/>
  <rect x="96" y="92" width="1344" height="680" rx="20" fill="#121C22" stroke="#1F3036"/>

  <text x="132" y="154" fill="#F2F7F4" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="760">Money Money Come</text>
  <text x="132" y="198" fill="#9EB2B0" font-family="Inter, Arial, sans-serif" font-size="22">OnchainOS smart-money wallet profiling skill</text>

  <g transform="translate(1090 120)">
