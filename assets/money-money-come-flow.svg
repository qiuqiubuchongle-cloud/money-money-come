  <g transform="translate(132 626)" font-family="Inter, Arial, sans-serif">
    <rect width="1272" height="86" rx="18" fill="#0F181D" stroke="#24363D"/>
    <text x="28" y="35" fill="#E9F3F0" font-size="20" font-weight="720">Default signal rule</text>
    <text x="28" y="64" fill="#9FB4B1" font-size="17">A formal alert requires multiple core wallets from the same positive group. External sources are optional confirmations, not required dependencies.</text>
    <rect x="1026" y="24" width="206" height="38" rx="19" fill="#1B2B30" stroke="#355059"/>
    <text x="1050" y="49" fill="#CFE6E0" font-size="15" font-weight="700">No auto trading</text>
  </g>
