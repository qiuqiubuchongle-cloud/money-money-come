<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Money Money Come 地址画像信息图</title>
  <desc id="desc">中文横屏信息图，展示基于 OKX OnchainOS 的多链聪明钱地址画像、人格分析、质量筛选和跟踪决策。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050706"/>
      <stop offset="0.58" stop-color="#0A0F0D"/>
      <stop offset="1" stop-color="#111816"/>
    </linearGradient>
    <linearGradient id="line" x1="170" y1="450" x2="1430" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E5FF66"/>
      <stop offset="0.48" stop-color="#21E68A"/>
      <stop offset="1" stop-color="#69C7FF"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <style>
      .font { font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { fill: #F4FFF8; font-size: 54px; font-weight: 820; letter-spacing: 0; }
      .sub { fill: #A6B9B2; font-size: 23px; font-weight: 540; letter-spacing: 0; }
      .card-title { fill: #F4FFF8; font-size: 27px; font-weight: 800; letter-spacing: 0; }
      .card-sub { fill: #99ADA5; font-size: 17px; font-weight: 520; letter-spacing: 0; }
      .small { fill: #AABCB5; font-size: 15px; font-weight: 520; letter-spacing: 0; }
      .pill-text { fill: #E8FFF1; font-size: 16px; font-weight: 730; letter-spacing: 0; }
      .muted { fill: #71847C; font-size: 14px; font-weight: 520; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="52" y="46" width="1496" height="808" rx="34" fill="#0A0F0D" stroke="#1C2A25"/>

  <g class="font">
    <text x="104" y="126" class="title">Money Money Come</text>
    <text x="104" y="174" class="sub">基于 OKX OnchainOS 构建的多链聪明钱地址画像与筛选 Skill</text>
    <g transform="translate(1128 96)">
      <rect width="324" height="54" rx="27" fill="#111A17" stroke="#2A4138"/>
      <circle cx="31" cy="27" r="9" fill="#21E68A"/>
      <text x="52" y="34" fill="#E6FFF0" font-size="17" font-weight="760">核心：先分析地址，再看信号</text>
    </g>
  </g>

  <g filter="url(#shadow)" class="font">
    <g transform="translate(104 238)">
      <rect width="316" height="452" rx="24" fill="#101715" stroke="#263832"/>
      <text x="28" y="54" class="card-title">地址池输入</text>
      <text x="28" y="86" class="card-sub">用户自己的聪明钱观察库</text>
      <g transform="translate(28 126)">
        <rect width="260" height="54" rx="16" fill="#17221F"/>
        <text x="18" y="34" class="pill-text">BSC / Solana / ETH 地址</text>
      </g>
      <g transform="translate(28 198)">
        <rect width="260" height="54" rx="16" fill="#17221F"/>
        <text x="18" y="34" class="pill-text">名称、备注、来源线索</text>
      </g>
      <g transform="translate(28 270)">
        <rect width="260" height="54" rx="16" fill="#17221F"/>
        <text x="18" y="34" class="pill-text">批量导入、去重、留档</text>
      </g>
      <text x="28" y="392" class="muted">不内置虚假地址包。</text>
      <text x="28" y="418" class="muted">价值来自你的私有观察池。</text>
    </g>

    <g transform="translate(462 238)">
      <rect width="316" height="452" rx="24" fill="#101715" stroke="#263832"/>
      <text x="28" y="54" class="card-title">链上证据层</text>
      <text x="28" y="86" class="card-sub">OnchainOS 数据转成可解释指标</text>
      <g transform="translate(28 118)">
        <rect width="260" height="62" rx="17" fill="#151F1C" stroke="#294037"/>
        <text x="18" y="30" fill="#DFFF70" font-size="16" font-weight="760">收益质量</text>
        <text x="18" y="52" class="small">已实现 PnL / 胜率 / 代表盈利</text>
      </g>
      <g transform="translate(28 198)">
        <rect width="260" height="62" rx="17" fill="#151F1C" stroke="#294037"/>
        <text x="18" y="30" fill="#DFFF70" font-size="16" font-weight="760">行为节奏</text>
        <text x="18" y="52" class="small">活跃度 / 高频风险 / 样本厚度</text>
      </g>
      <g transform="translate(28 278)">
        <rect width="260" height="62" rx="17" fill="#151F1C" stroke="#294037"/>
        <text x="18" y="30" fill="#DFFF70" font-size="16" font-weight="760">Meme 适配</text>
        <text x="18" y="52" class="small">入场市值 / 低市值买入占比</text>
      </g>
      <text x="28" y="398" class="muted">每个结论都要能回到链上证据。</text>
    </g>

    <g transform="translate(820 238)">
      <rect width="316" height="452" rx="24" fill="#101715" stroke="#2A4639"/>
      <text x="28" y="54" class="card-title">Wallet Persona</text>
      <text x="28" y="86" class="card-sub">把地址变成可读、可复盘的人设</text>
      <g transform="translate(28 120)">
        <rect width="124" height="38" rx="19" fill="#183026" stroke="#365E49"/>
        <text x="22" y="25" class="pill-text">叙事猎人</text>
      </g>
      <g transform="translate(164 120)">
        <rect width="124" height="38" rx="19" fill="#17241F" stroke="#304139"/>
        <text x="22" y="25" class="pill-text">稳健盈利</text>
      </g>
      <g transform="translate(28 176)">
        <rect width="124" height="38" rx="19" fill="#17241F" stroke="#304139"/>
        <text x="22" y="25" class="pill-text">信仰加仓</text>
      </g>
      <g transform="translate(164 176)">
        <rect width="124" height="38" rx="19" fill="#17241F" stroke="#304139"/>
        <text x="22" y="25" class="pill-text">热点切换</text>
      </g>
      <g transform="translate(28 232)">
        <rect width="124" height="38" rx="19" fill="#17241F" stroke="#304139"/>
        <text x="22" y="25" class="pill-text">链上打点</text>
      </g>
      <g transform="translate(164 232)">
        <rect width="124" height="38" rx="19" fill="#17241F" stroke="#304139"/>
        <text x="22" y="25" class="pill-text">后排冲锋</text>
      </g>
      <text x="28" y="334" fill="#E8FFF1" font-size="17" font-weight="760">能力雷达</text>
      <text x="28" y="366" class="small">发现力 / 执行力 / 退出纪律</text>
      <text x="28" y="392" class="small">真人感 / 机器人感 / 可跟随性</text>
    </g>

    <g transform="translate(1178 238)">
      <rect width="316" height="452" rx="24" fill="#101715" stroke="#2A4639"/>
      <text x="28" y="54" class="card-title">Wallet Decision</text>
      <text x="28" y="86" class="card-sub">把人设落成筛选动作</text>
      <g transform="translate(28 122)">
        <rect width="260" height="54" rx="16" fill="#1B3328"/>
        <text x="18" y="34" fill="#E9FFF1" font-size="18" font-weight="800">A 重点跟踪</text>
      </g>
      <g transform="translate(28 190)">
        <rect width="260" height="54" rx="16" fill="#17231F"/>
        <text x="18" y="34" class="pill-text">B 观察验证</text>
      </g>
      <g transform="translate(28 258)">
        <rect width="260" height="54" rx="16" fill="#17231F"/>
        <text x="18" y="34" class="pill-text">C 只看题材</text>
      </g>
      <g transform="translate(28 326)">
        <rect width="260" height="54" rx="16" fill="#17231F"/>
        <text x="18" y="34" class="pill-text">D 排除留档</text>
      </g>
      <text x="28" y="424" class="muted">输出信任分、用途、风险、失效条件。</text>
    </g>
  </g>

  <path d="M428 464H454" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <path d="M786 464H812" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <path d="M1144 464H1170" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <path d="M450 454L466 464L450 474V454Z" fill="#21E68A"/>
  <path d="M808 454L824 464L808 474V454Z" fill="#21E68A"/>
  <path d="M1166 454L1182 464L1166 474V454Z" fill="#21E68A"/>

  <g transform="translate(104 744)" class="font">
    <rect width="1390" height="72" rx="22" fill="#0F1715" stroke="#24372F"/>
    <text x="28" y="45" fill="#E8FFF1" font-size="21" font-weight="800">产品重心：</text>
    <text x="134" y="45" fill="#A6B9B2" font-size="19" font-weight="560">地址分析、人设判断、质量筛选、跟踪策略。信号通知只是辅助输出，负责把筛选后的结果送到你面前。</text>
  </g>
</svg>
