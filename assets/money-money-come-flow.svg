    <circle cx="26" cy="22" r="8" fill="#79E6B0"/>
    <text x="46" y="29" fill="#CFE6E0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="650">Analysis only by default</text>
  </g>

  <path d="M248 430H1288" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <path d="M1280 430L1256 416V444L1280 430Z" fill="#B7A6FF"/>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <g transform="translate(142 290)">
